services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-gestion_plantas}
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?Configura POSTGRES_ADMIN_PASSWORD en .env}
      APP_DB_USER: ${DB_USERNAME:-gestion_app}
      APP_DB_PASSWORD: ${DB_PASSWORD:?Configura DB_PASSWORD en .env}
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./scripts/init-db.sh:/docker-entrypoint-initdb.d/01-app-user.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  backend:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_NAME: Gestion de Plantas
      APP_ENV: production
      APP_KEY: ${APP_KEY:-}
      APP_DEBUG: "false"
      APP_URL: ${APP_URL:-http://localhost:8080}
      APP_LOCALE: es
      APP_FALLBACK_LOCALE: es
      APP_TIMEZONE: America/Bogota
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-*}
      LOG_CHANNEL: stderr
      LOG_LEVEL: warning
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: "5432"
      DB_DATABASE: ${DB_DATABASE:-gestion_plantas}
      DB_USERNAME: ${DB_USERNAME:-gestion_app}
      DB_PASSWORD: ${DB_PASSWORD:?Configura DB_PASSWORD en .env}
      SESSION_DRIVER: database
      SESSION_LIFETIME: "480"
      SESSION_ENCRYPT: "false"
      SESSION_DOMAIN: ${SESSION_DOMAIN:-}
      SESSION_SECURE_COOKIE: ${SESSION_SECURE_COOKIE:-false}
      SESSION_SAME_SITE: lax
      SANCTUM_STATEFUL_DOMAINS: ${SANCTUM_STATEFUL_DOMAINS:-localhost:8080,127.0.0.1:8080}
      CACHE_STORE: database
      QUEUE_CONNECTION: sync
      MAIL_MAILER: log
    volumes:
      - laravel_storage:/var/www/html/storage
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@fsockopen('127.0.0.1', 9000) ? 0 : 1);"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  frontend:
    build:
      context: ../../frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/up || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

volumes:
  postgres_data:
  laravel_storage:
